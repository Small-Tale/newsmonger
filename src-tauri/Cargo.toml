[package]
name = "newsmonger"
version = "0.4.0"
description = "Newsmonger desktop app"
edition = "2021"

[lib]
name = "newsmonger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The binary is `Newsmonger`, not the package's lowercase `newsmonger` (NEWS-184).
#
# macOS names a *running* application from `CFBundleExecutable` — not from
# `CFBundleName` or `CFBundleDisplayName`, both of which were already correct.
# So the Dock's hover label, its context menu and the menu bar all read the
# executable's filename, and showed `newsmonger` while Finder and Spotlight
# showed `Newsmonger`.
#
# Renaming the binary here rather than via tauri.conf.json's `mainBinaryName`
# fixes `tauri dev` too: that option only renames during `tauri build`, whereas
# cargo emitting the right name covers both. It is also what the Tauri config
# schema recommends — set the target's name rather than override it downstream.
[[bin]]
name = "Newsmonger"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
# Relaunch after an update installs (NEWS-89), same as glassbox.
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
