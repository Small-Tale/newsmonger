<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="cards.css">
<title>Briefing card — story with a photo</title>
<body>
  <div class="media"><img src="photo.png" alt=""></div>
  <div class="body">
    <div class="rule"></div>
    <div class="kicker">Climate &amp; Environment</div>
    <h1 class="headline">Grid operators clear record solar output for a fourth straight week</h1>
    <p class="deck">Regional operators reported sustained midday surpluses, pushing curtailment decisions onto storage rather than generation for the first time this season.</p>
    <div class="attribution">
      <span class="outlet">Reuters</span>
      <span class="meta">2 sources · 29 Jul</span>
    </div>
  </div>
</body>
