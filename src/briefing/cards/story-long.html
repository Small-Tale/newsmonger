<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="cards.css">
<title>Briefing card — long headline, one-line deck</title>
<body>
  <div class="media"><img src="photo.png" alt=""></div>
  <div class="body">
    <div class="rule"></div>
    <div class="kicker">Technology · Semiconductors</div>
    <h1 class="headline is-long">Memory supplier warns high-bandwidth allocation is already committed through the first half of next year, with contract prices rising again</h1>
    <p class="deck">Shares fell 4% on the guidance.</p>
    <div class="attribution">
      <span class="outlet">bloomberg.com</span>
      <span class="meta">3 sources · 29 Jul</span>
    </div>
  </div>
</body>
