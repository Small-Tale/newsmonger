# Signed, notarized macOS release bundles (NEWS-190).
#
# Two ways in, deliberately:
#
#   workflow_dispatch  — build and verify, publish nothing. Use this FIRST. It
#                        exercises the whole signing and notarization path
#                        without creating a release, so a credential problem
#                        costs a red run instead of a half-published tag.
#   push: tags v*      — build, verify, then publish a GitHub Release.
#
# Channels are one workflow, not two. Production and beta need *identical*
# Apple credentials — there is no beta Developer ID certificate and notarization
# does not distinguish channels — so the only difference is the tag shape and
# the prerelease flag. See docs/5-desktop-app.md.
#
#   v1.2.0         -> normal release
#   v1.2.0-beta.1  -> prerelease
#
# Required secrets are documented in docs/5-desktop-app.md → "GitHub Actions
# secrets". If notarization starts failing with an authentication error and
# nothing in the repo changed, the likely cause is that the Apple ID's account
# password was changed: that revokes every app-specific password on the account.
# Regenerate at appleid.apple.com and update APPLE_PASSWORD.

name: Release

on:
  push:
    tags: ['v*']
  # No inputs on purpose. A manual run is *always* a dry run, so there is no way
  # to publish from a branch — GITHUB_REF would be refs/heads/<branch> and the
  # release would be named after it.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  macos:
    name: macOS (aarch64) — sign, notarize, verify
    # Must be macOS: codesign, notarytool and stapler are Apple tools and exist
    # nowhere else. macos-latest is arm64, which matches the only target that has
    # ever been bundle-verified (FR-5.3).
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Fast gates before spending ~20 minutes on a bundle. ci.yml covers E2E on
      # the same commit; this is here so a release can't publish something that
      # doesn't even compile.
      - name: Gates (typecheck, lint, unit)
        run: |
          npm run typecheck
          npm run lint
          npx vitest run --coverage=false

      # The tag is the only place the release version is stated, and the bundle
      # takes its version from tauri.conf.json. Nothing links the two, so
      # tagging v0.2.0 against a 0.1.0 config would publish a release whose
      # assets are all named 0.1.0 — and nothing would complain.
      #
      # Only the BASE version has to match: the prerelease suffix lives on the
      # tag, not in tauri.conf.json, because macOS bundle version fields do not
      # take semver prerelease suffixes.
      - name: Check the tag matches the configured version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          base="${tag%%-*}"
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./package.json').version")
          echo "tag=$tag base=$base tauri.conf.json=$conf package.json=$pkg"
          if [ "$base" != "$conf" ] || [ "$base" != "$pkg" ]; then
            echo "::error::Tag base version '$base' does not match tauri.conf.json ($conf) and package.json ($pkg)."
            exit 1
          fi

      # Tauri does the keychain work itself when APPLE_CERTIFICATE is set — it
      # creates a temporary keychain, imports the .p12, and cleans up. Do not
      # hand-roll `security create-keychain` here; two keychains fighting over
      # the same identity is a confusing failure.
      #
      # Notarization uses the app-specific-password route, so every value is a
      # plain string and there is no credential-prep step. Switching to an App
      # Store Connect key later would add one, because APPLE_API_KEY_PATH is a
      # filesystem path and a secret cannot hold a path.
      - name: Build, sign and notarize
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # No --target. verify-signing.sh reads
        # src-tauri/target/release/bundle/..., and passing an explicit target
        # moves everything under src-tauri/target/<triple>/release/bundle/.
        run: npm run tauri:build

      # The gate that matters. The build machine cannot test what it needs to —
      # it trusts its own certificate and never quarantines a file it made — so
      # this asserts here what Gatekeeper will decide there. A release that
      # skips it is unverified by construction, which is why it runs before
      # anything is published.
      - name: Verify the bundle is distributable
        run: bash scripts/verify-signing.sh

      # Uploaded even on failure: when signing goes wrong, the bundle is the
      # evidence, and re-running to get a copy wastes another notarization.
      - name: Upload bundle artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64-bundle
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: warn
          retention-days: 14

      # A hyphen in the tag means a prerelease: v1.2.0-beta.1 yes, v1.2.0 no.
      # Derived rather than configured, so cutting a beta needs no second
      # workflow and no second set of secrets to drift out of sync.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          flags=()
          case "$tag" in
            *-*) flags+=(--prerelease); echo "prerelease: $tag" ;;
            *)   echo "production release: $tag" ;;
          esac
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            "${flags[@]}" \
            src-tauri/target/release/bundle/dmg/*.dmg
