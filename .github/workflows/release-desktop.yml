name: Release Desktop App

# Ported from ~/Documents/glassbox/.github/workflows/release-desktop.yml.
#
# Replaces the earlier hand-rolled release.yml: `tauri-action` builds and uploads
# per platform, `latest.json` is generated for the updater, and the release is
# held as a draft until every asset is in place.

permissions:
  contents: write

on:
  push:
    tags:
      - 'v[0-9]*'
      - '!v*-rc.*'
      - '!v*-beta.*'

  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.2.0)'
        required: true

jobs:
  # Create the GitHub Release first so build jobs don't race
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v7

      # First, before the release shell exists and before the ~20-minute signed
      # build (NEWS-208). The old `release.yml` had this and the NEWS-201 port
      # dropped it. Nothing else links the tag to the version files, and a
      # mismatch is silent: the build succeeds, the release page looks right, and
      # every asset is named after the wrong version — including the download
      # links generated below, which would point at filenames that never exist.
      - name: Check the tag matches the configured version
        run: bash scripts/check-tag-version.sh "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
        shell: bash

      - name: Extract release notes from tag
        id: tag_notes
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          REPO="${{ github.repository }}"

          # The annotated tag's message, which `npm run release` writes from the
          # gitgist-drafted notes. When absent, the Download section below stands
          # on its own so the release page never falls back to a generic stub.
          NOTES=$(git tag -l --format='%(contents)' "$TAG" | sed '/^$/d')

          # The "## Download" block is generated by
          # scripts/release/release-assets.mjs — the same module the rename step
          # below imports, so every link always resolves to a shipped asset name.
          # Run with the runner's preinstalled node (no npm install / tsx needed).
          {
            if [ -n "$NOTES" ]; then
              echo "$NOTES"
              echo ""
            fi
            node scripts/release/release-assets.mjs download-section "$VERSION" "$REPO" "$TAG"
          } > /tmp/release-notes.md

          echo "body<<ENDOFNOTES" >> "$GITHUB_OUTPUT"
          cat /tmp/release-notes.md >> "$GITHUB_OUTPUT"
          # `download-section` prints without a trailing newline (it returns
          # lines.join('\n')). Without this explicit newline the closing delimiter
          # glues onto the last notes line, GitHub never sees a standalone
          # `ENDOFNOTES`, and the step output is rejected with "Matching delimiter
          # not found".
          echo "" >> "$GITHUB_OUTPUT"
          echo "ENDOFNOTES" >> "$GITHUB_OUTPUT"

      # Always create as a draft. A non-draft release is immediately public AND
      # immediately flips GitHub's `releases/latest` pointer, but the platform
      # matrix below takes 10–30 minutes to upload bundles and rename the DMGs.
      # The updater endpoint (`/releases/latest/download/latest.json` in
      # tauri.conf.json) resolves through that flipped pointer, so a non-draft
      # release would start serving a half-published version to real users
      # mid-build. GitHub skips drafts for both the public Releases page and the
      # `latest` pointer, so staying a draft until the very end keeps publication
      # atomic — the prior stable stays "latest" until `publish-release` flips it.
      - name: Create release (as draft — flipped by publish-release at end)
        id: create
        uses: actions/github-script@v7
        env:
          RELEASE_BODY: ${{ steps.tag_notes.outputs.body }}
        with:
          script: |
            const tag = '${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}';
            // Body via env, not a template literal: the notes contain backticks
            // (the npm install snippet) that would otherwise break the JS string.
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Newsmonger ${tag}`,
              body: process.env.RELEASE_BODY,
              draft: true,
              prerelease: false,
            });
            return data.id;

  build:
    needs: [create-release]

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    # Restored with NEWS-197; it was lost when NEWS-201 replaced `release.yml`.
    # NEWS-194 set it because a 60-minute cap killed a build that was waiting
    # legitimately — notarization normally takes 5–15 minutes, but a first
    # submission under a new Team ID is commonly far slower. Without it the job
    # inherits GitHub's **360-minute** default, and this project has seen
    # submissions sit `In Progress` for 10.8 hours — six hours × two macOS
    # shards, at 10× billing, to learn nothing the first hour didn't tell you.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches the Node the sidecar bundles (scripts/build-sidecar.sh pins
          # v22.14.0) and the 22.5 floor the server's node:sqlite requires.
          node-version: '22'
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm ci

      # Downloads the target's Node binary, builds the server + client bundles,
      # and stages src-tauri/server/. Runs here rather than only as Tauri's
      # beforeBuildCommand so the target triple is passed explicitly.
      - name: Build sidecar
        run: bash scripts/build-sidecar.sh ${{ matrix.target }}
        shell: bash

      # Tauri drives `notarytool` internally and prints one "Notarizing …" line,
      # then nothing until it returns. This polls Apple from beside the build so
      # the log says whether the queue was moving (NEWS-197).
      - name: Watch Apple's notarization queue
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/notary-watch.sh start

      - name: Build Tauri app and upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target ${{ matrix.target }}

      # `always()`: a build that succeeded quickly is itself worth knowing about,
      # and on a timeout this is the only record of whether Apple ever answered.
      - name: Report what the notarization queue was doing
        if: always() && runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        run: bash scripts/notary-watch.sh report

      # The gate that matters (FR-5.7). The build machine cannot test what it
      # needs to — it trusts its own certificate and never quarantines a file it
      # made — so this asserts here what Gatekeeper will decide there: a Developer
      # ID authority, the hardened runtime, the sidecar's JIT entitlements, the
      # *absence* of `get-task-allow`, a deep strict verify, and a stapled ticket
      # on **both** the app and the `.dmg`.
      #
      # NOT `continue-on-error`, unlike the diagnostics around it: every one of
      # these can be wrong while the build is green and the release page looks
      # right, and the symptom is a user who cannot open the app. Failing the job
      # is the point (NEWS-220).
      #
      # The assets are already uploaded by this step — `tauri-action` uploads as
      # it builds — but the release is still a **draft** until `publish-release`
      # flips it, and this job is in that job's `needs`. So a failure here stops
      # anything reaching a user, which is the property worth having.
      - name: Verify the bundle is distributable
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/verify-signing.sh

      # Restored with NEWS-197 (NEWS-194 added it to the workflow NEWS-201
      # deleted). `In Progress` means Apple is still thinking, `Invalid` means it
      # refused — one word, and the fixes share nothing. Also prints the newest
      # submission id and Apple's own log for it, which every past diagnosis here
      # depended on and which was otherwise only recoverable by grepping an error
      # string out of the raw job log.
      #
      # `continue-on-error`, deliberately: a diagnostic that can fail the job
      # obscures the failure it exists to explain.
      - name: On failure, dump Apple's notarization history
        if: failure() && runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/notary-watch.sh history

  # Rename the user-facing installer assets to human-friendly names. Runs once,
  # after every platform shard has uploaded, so the rename is race-free (a single
  # job touching each asset exactly once). The names come from
  # scripts/release/release-assets.mjs — the same module that generates the
  # download links — so links and asset names cannot drift apart. Only .dmg files
  # are renamed; the updater's latest.json references the others by original name.
  rename-assets:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rename user-facing download assets to friendly names
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const path = require('node:path');
            const modPath = path.join(process.env.GITHUB_WORKSPACE, 'scripts/release/release-assets.mjs');
            const { friendlyName } = await import(pathToFileURL(modPath).href);

            const releaseId = parseInt(process.env.RELEASE_ID);
            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              per_page: 100,
            });

            for (const asset of assets) {
              const newName = friendlyName(asset.name);
              if (newName !== asset.name) {
                console.log(`Renaming: ${asset.name} -> ${newName}`);
                await github.rest.repos.updateReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id,
                  name: newName,
                });
              }
            }

  # Atomic flip of the release from draft → published.
  #
  # Last job in the pipeline. Runs only after every platform build has uploaded
  # and rename-assets has renamed the .dmg files the release notes link to. At
  # that point the draft has all its assets, so flipping `draft:false` is the
  # single moment when the page becomes public with every link resolving, the
  # `releases/latest` pointer moves, and the updater starts seeing the new
  # latest.json.
  #
  # `make_latest: 'true'` is the API equivalent of the "Set as the latest release"
  # checkbox — explicit so the flip can't be silently downgraded by repo settings.
  publish-release:
    needs: [create-release, build, rename-assets]
    runs-on: ubuntu-latest
    steps:
      - name: Flip release from draft → published
        uses: actions/github-script@v7
        with:
          script: |
            const releaseId = ${{ needs.create-release.outputs.release_id }};
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              draft: false,
              make_latest: 'true',
            });
            console.log(`Release ${releaseId} flipped from draft → published`);
