name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches the Node the desktop sidecar bundles (scripts/build-sidecar.sh).
  NODE_VERSION: '22'

jobs:
  gate:
    name: Typecheck, lint, unit + E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # Cache the browser binaries, keyed on the resolved Playwright version so
      # a version bump misses the cache instead of running against stale ones.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # The cache holds the browsers but not the apt libraries they link against.
      - name: Install Playwright system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # typecheck + lint + vitest + Playwright (E2E runs the mock provider via
      # --ai-test, so CI needs no API key), then merges coverage.
      #
      # `RUST_GATES=skip` because the `rust` job below already runs them, with the
      # webkit/glib dev headers the Tauri crate links against installed. This
      # runner has none of them, so compiling here fails with "The system library
      # `glib-2.0` ... was not found" — which is what red-lit main when the Rust
      # gates were first folded into `test:all`. Installing the headers a second
      # time to run the same four checks a second time is the wrong fix.
      - run: npm run test:all
        env:
          RUST_GATES: skip

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # The demo capture is manual and run rarely, which is how it sat broken for
  # weeks: the backup offer (FR-27.4) started firing at the third topic and its
  # modal backdrop swallowed the hero's discover click, so the script timed out
  # against an invisible interceptor (NEWS-263). Nothing noticed, because nothing
  # ran it.
  #
  # This is deliberately a **smoke** run, not a regeneration: one non-soaking
  # scene, which boots the real server and drives the real UI in about fifteen
  # seconds. That is enough to catch a modal eating a click, a selector that
  # stopped matching, or a readiness line that changed. A full run is minutes,
  # most of it the `topics` scene's soak, and it buys very little more.
  #
  # It uploads what it captured so a failure can be looked at rather than guessed
  # about, and it never commits anything — the tracked stills are regenerated by
  # hand when the UI genuinely changes.
  demo-capture:
    name: Demo capture smoke (one scene)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Capture one scene
        run: npm run demo:stills -- --only feed

      # A zero exit is not proof on its own — assert the artifact exists and has
      # real bytes, so a script that "succeeded" while writing nothing still fails.
      - name: It actually produced a picture
        run: |
          set -euo pipefail
          test -s assets/stills/feed.png
          test -s assets/stills/feed.svg
          node -e "const {statSync}=require('fs'); const n=statSync('assets/stills/feed.png').size; if (n < 20000) { console.error('feed.png is only '+n+' bytes — probably a blank frame'); process.exit(1); } console.log('feed.png '+n+' bytes')"

      # `--only` must not disturb the scenes it isn't capturing. The first version
      # of this flag did: `main()` wipes the output directory to clear a renamed
      # scene's stale file, and with `--only` that deleted the other six. `git
      # status` caught it locally; this catches it next time.
      - name: The other scenes are untouched
        run: |
          set -euo pipefail
          for scene in topics discover tuner review settings-source export; do
            test -s "assets/stills/$scene.png" || { echo "--only deleted $scene.png"; exit 1; }
          done
          changed=$(git diff --name-only -- assets/stills/ | grep -v '^assets/stills/feed\.' || true)
          if [ -n "$changed" ]; then
            echo "--only feed also modified:"; echo "$changed"; exit 1
          fi
          echo "only the feed scene changed"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: demo-capture-smoke
          path: |
            assets/stills/feed.png
            assets/stills/feed.svg
          retention-days: 7

  rust:
    name: Tauri shell (debug + release cfg)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      # Why this is needed at all — and why stubs rather than a real sidecar — is
      # documented in the script. Extracted there (NEWS-201) once
      # release-candidate.yml's Rust job needed the same thing.
      - name: Stub the sidecar paths tauri-build checks for
        run: bash scripts/ensure-sidecar-stub.sh

      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check

      # Both profiles, deliberately. The dev and release server-spawn paths in
      # src/lib.rs sit behind `#[cfg(debug_assertions)]` / `#[cfg(not(...))]`,
      # so a debug-only check never compiles the release branch at all — a
      # broken release path would sail through and only fail at bundle time.
      - name: Check (debug)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Check (release cfg)
        working-directory: src-tauri
        run: cargo clippy --release --all-targets -- -D warnings

      # There are no Rust tests today, so this is a no-op that costs seconds — but
      # it means the first one someone writes is run rather than silently ignored,
      # and it keeps this job identical to `release-candidate.yml`'s and to
      # `scripts/gates-rust.sh` (asserted by tests/unit/release-scripts.test.ts).
      - name: Test
        working-directory: src-tauri
        run: cargo test
